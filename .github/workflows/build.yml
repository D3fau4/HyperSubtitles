name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild HyperSubtitles.sln /p:Configuration=Release /p:Platform=x86 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypersubtitles-winmm
          path: |
            **/Release/winmm.dll
          if-no-files-found: error

  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev

      - name: Configure
        run: cmake -S Editor -B Editor/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Editor/build --config Release --parallel

      - name: Test
        run: ctest --test-dir Editor/build -C Release --output-on-failure

      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hypersubtitles-editor-windows
          path: Editor/build/Release/HyperSubtitlesEditor.exe
          if-no-files-found: error

  package:
    needs: [build, editor]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download winmm.dll
        uses: actions/download-artifact@v4
        with:
          name: hypersubtitles-winmm
          path: artifacts/winmm

      - name: Download editor
        uses: actions/download-artifact@v4
        with:
          name: hypersubtitles-editor-windows
          path: artifacts/editor

      - name: Build release package
        run: |
          python3 tools/package/package.py \
            --dll "$(find artifacts/winmm -name winmm.dll | head -n 1)" \
            --editor artifacts/editor/HyperSubtitlesEditor.exe \
            --out dist --version "${GITHUB_SHA::7}"
          echo "PACKAGE=HyperSubtitles-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}
          if-no-files-found: error
