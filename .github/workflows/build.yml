name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild HyperSubtitles.sln /p:Configuration=Release /p:Platform=x86 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypersubtitles-winmm
          path: |
            **/Release/winmm.dll
          if-no-files-found: error
